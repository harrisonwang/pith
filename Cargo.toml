[workspace]
resolver = "2"
members = [
    "crates/spoor-core",
    "crates/spoor-cli",
    "crates/spoor-wasm",
    "bindings/python",
    "bindings/node",
    "examples/rust-core-embed",
]
default-members = [
    "crates/spoor-core",
    "crates/spoor-cli",
]
# 独立示例：自带 tokio/reqwest/rmcp 等重依赖，不进主 workspace，用自己的 Cargo.lock。
exclude = [
    "examples/agent-spoor/rust",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/harrisonwang/spoor"
homepage = "https://github.com/harrisonwang/spoor"
authors = ["harrisonwang <harrisonwang.dev@gmail.com>"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spoor-core = { path = "crates/spoor-core", version = "0.9.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
